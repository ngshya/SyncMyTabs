<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SyncMyTabs</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      width: 300px;
      padding: 16px;
    }
    .row {
      font-size: 13px;
      margin-bottom: 8px;
      color: var(--row-fg);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .row strong { color: var(--row-strong); text-align: right; }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 9px 0;
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:hover { background: var(--accent-hover); }
    button:disabled { background: var(--accent-disabled); color: var(--accent-disabled-fg); cursor: default; }
    .secondary { background: var(--secondary-bg); }
    .secondary:hover { background: var(--secondary-hover); }
    .feature-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid var(--hairline);
    }
    .feature-row:last-of-type { border-bottom: none; }
    .feature-name { font-size: 13px; font-weight: 500; }
    .feature-hint { font-size: 11px; color: var(--muted); margin-top: 1px; }
    .switch { position: relative; display: inline-block; width: 38px; height: 21px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: var(--switch-track);
      border-radius: 21px; transition: 0.15s; cursor: pointer;
    }
    .slider::before {
      content: ""; position: absolute; width: 15px; height: 15px;
      left: 3px; top: 3px; background: var(--switch-thumb); border-radius: 50%;
      transition: 0.15s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before { transform: translateX(17px); }
    .paused-note {
      font-size: 12px; color: var(--paused-fg); background: var(--paused-bg);
      border: 1px solid var(--paused-border); border-radius: 6px;
      padding: 6px 8px; margin-bottom: 10px;
    }
    #status {
      font-size: 12px; color: var(--status-ok); text-align: center;
      min-height: 14px; margin-top: 6px;
    }
    .version { font-size: 11px; color: var(--version-fg); text-align: center; margin-top: 10px; }
    hr { border: none; border-top: 1px solid var(--hairline); margin: 12px 0; }
  </style>
</head>
<body>
  <div class="row">
    <span>Profile</span><strong id="profileName">—</strong>
  </div>
  <div id="pausedNote" class="paused-note" hidden>
    Paused — this device won't send or receive tab updates.
  </div>

  <div class="feature-row">
    <div>
      <div class="feature-name">Open tabs sync</div>
      <div class="feature-hint">Also the master switch</div>
    </div>
    <label class="switch">
      <input type="checkbox" id="syncToggle" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="feature-row">
    <div class="feature-name">Tab groups</div>
    <label class="switch">
      <input type="checkbox" id="groupsToggle" />
      <span class="slider"></span>
    </label>
  </div>
  <div class="feature-row">
    <div class="feature-name">Auto-archive idle tabs</div>
    <label class="switch">
      <input type="checkbox" id="archiveToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <button id="syncNow">Sync now</button>
  <div id="status"></div>

  <div class="row" style="margin-top: 10px;">
    <span>Last activity</span><strong id="lastActivity">—</strong>
  </div>

  <hr />
  <button id="openOptions" class="secondary">Open full settings</button>
  <div class="version" id="version"></div>

  <script src="browser-polyfill.min.js"></script>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
