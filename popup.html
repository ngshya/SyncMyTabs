<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SyncMyTabs</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      width: 260px;
      padding: 14px;
      background: #ffffff;
      color: #1a1a1a;
    }
    .row {
      font-size: 13px;
      margin-bottom: 6px;
      color: #444;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .row strong { color: #111; text-align: right; }
    button {
      width: 100%;
      margin-top: 10px;
      padding: 10px 0;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #93b4f0; cursor: default; }
    select {
      width: 100%;
      margin-top: 4px;
      padding: 6px 8px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .section-title {
      font-size: 12px;
      color: #888;
      margin-top: 16px;
      margin-bottom: 2px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .button-row {
      display: flex;
      gap: 8px;
    }
    .button-row button { margin-top: 6px; }
    .secondary { background: #444; }
    .secondary:hover { background: #333; }
    .inline-row {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-top: 4px;
    }
    .inline-row select { margin-top: 0; }
    .inline-row button {
      width: auto;
      margin-top: 0;
      padding: 6px 10px;
      font-size: 12px;
      white-space: nowrap;
    }
    .sync-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #eee;
    }
    .sync-label { font-size: 13px; font-weight: 600; color: #111; }
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; background: #c7ccd4;
      border-radius: 22px; transition: 0.15s; cursor: pointer;
    }
    .slider::before {
      content: ""; position: absolute; width: 16px; height: 16px;
      left: 3px; top: 3px; background: #fff; border-radius: 50%;
      transition: 0.15s;
    }
    .switch input:checked + .slider { background: #2563eb; }
    .switch input:checked + .slider::before { transform: translateX(18px); }
    .paused-note {
      font-size: 12px; color: #b45309; background: #fff7ed;
      border: 1px solid #fed7aa; border-radius: 6px;
      padding: 6px 8px; margin-bottom: 10px;
    }
    .version {
      font-size: 11px; color: #9aa0a6; text-align: center;
      margin-top: 14px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1e1f22; color: #e6e6e6; }
      .row { color: #b8bcc4; }
      .row strong { color: #f1f1f1; }
      select {
        background: #2a2b2e;
        color: #e6e6e6;
        border-color: #44464b;
      }
      .section-title { color: #9aa0a6; }
      button:disabled { background: #2b3a63; color: #9db2e0; }
      .secondary { background: #3a3b3f; }
      .secondary:hover { background: #46474c; }
      .sync-bar { border-bottom-color: #33353a; }
      .sync-label { color: #f1f1f1; }
      .slider { background: #4b4d52; }
      .paused-note {
        color: #fcd9a8; background: #3a2c17; border-color: #6b4f24;
      }
    }
  </style>
</head>
<body>
  <div class="sync-bar">
    <span class="sync-label">Synchronization</span>
    <label class="switch">
      <input type="checkbox" id="syncToggle" />
      <span class="slider"></span>
    </label>
  </div>
  <div id="pausedNote" class="paused-note" hidden>
    Paused — this device won't send or receive tab updates.
  </div>

  <div class="row"><span>Device</span><strong id="deviceName">—</strong></div>
  <div class="row"><span>Interval</span><strong id="interval">—</strong></div>
  <div class="row"><span>Last activity</span><strong id="lastActivity">—</strong></div>

  <div class="section-title">Active profile</div>
  <div class="inline-row">
    <select id="activeProfileSelect"></select>
    <button id="switchProfile" class="secondary">Switch</button>
  </div>

  <button id="syncNow">Sync now</button>

  <div class="section-title">Restore from device</div>
  <select id="restoreProfileSelect"></select>
  <select id="deviceSelect"></select>
  <div class="button-row">
    <button id="restoreReplace">Replace</button>
    <button id="restoreAdd" class="secondary">Add</button>
  </div>
  <div id="restoreStatus" style="font-size: 12px; margin-top: 6px; color: #16a34a;"></div>

  <div class="version" id="version"></div>

  <script src="browser-polyfill.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
