<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    /* Keyboard focus scrolling a row into view must not park it under the
       sticky search bar. --bar-h is measured by newtab.js. */
    html { scroll-padding-top: calc(var(--bm-h, 0px) + var(--bar-h, 66px) + 4px); }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 9vh 16px 64px;
    }

    .clock { text-align: center; margin-bottom: 18px; }
    #time {
      font-size: 72px;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #date { margin-top: 10px; font-size: 15px; color: var(--muted); }
    #date::first-letter { text-transform: uppercase; }

    /* Not the full width of a wide page — a long empty bar reads as a
       form field, not a quick filter. The box is the frame; the input and
       the picked search service's chip (newtab.js) sit inside it. */
    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 600px;
      margin: 0 auto;
      padding: 0 6px 0 14px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .search-box:focus-within { border-color: var(--accent); }
    #search {
      flex: 1;
      min-width: 0;
      padding: 11px 0;
      font: inherit;
      font-size: 15px;
      color: var(--fg);
      background: none;
      border: none;
      outline: none;
    }
    .search-chip {
      flex-shrink: 0;
      padding: 3px 9px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-fg);
      background: var(--accent);
      border-radius: 999px;
    }

    /* The web row under the search box, and the services under it. */
    #webActions { max-width: 600px; margin: 2px auto 0; }
    .item.web .num { color: var(--accent); font-weight: 600; }
    .item.web:disabled { cursor: default; color: var(--muted); }
    .engines {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 2px;
      padding: 4px 10px 0;
      font-size: 12px;
      color: var(--muted);
    }
    .engines-hint { margin-right: 4px; }
    .engine {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 2px 5px 2px 3px;
      color: var(--muted);
      text-decoration: none;
      border-radius: 999px;
    }
    .engine:hover, .engine:focus-visible { color: var(--fg); background: var(--card-bg); outline: none; }
    .engine.active { color: var(--accent-fg); background: var(--accent); }
    .engine-key {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      font-size: 9.5px;
      font-weight: 700;
      border: 1px solid currentColor;
      border-radius: 4px;
      opacity: 0.8;
    }
    /* Stays put while the list scrolls under it. */
    #searchBar {
      position: sticky;
      top: var(--bm-h, 0px); /* right below the bookmarks bar, when shown */
      z-index: 2;
      padding: 10px 0;
      /* Frosted rather than solid: the list scrolling underneath stays
         legible, and the optional background rain isn't cut off by a hard
         band. */
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }

    section { margin-top: 18px; }

    /* Two columns on a wide window: tabs fill them in reading order —
       one on the left, the next on its right (see newtab.js's render) —
       so numbers still run in sequence. Group headers and section titles
       span the full width; one column below the threshold. */
    .tab-grid { display: grid; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 1000px) {
      main { max-width: 1120px; }
      .tab-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; }
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--section-title);
      margin: 0 0 10px;
      text-align: center;
    }
    /* A new window (or the archived part) starts after a clear gap,
       so its centred title reads as the start of a new section rather
       than one more line of the list above. Margins collapse, so a group
       right before it doesn't add its own gap on top. */
    #local .section-title:not(:first-child) { margin-top: 44px; }
    #archivedSection { margin-top: 44px; }
    .sub-title {
      font-size: 12px;
      color: var(--muted);
      margin: 14px 0 4px 10px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      margin-top: 4px;
      font: inherit;
      font-weight: 600;
      color: var(--fg);
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .group-header:hover, .group-header:focus-visible { background: var(--card-bg); outline: none; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .group-header .count { font-weight: 400; color: var(--muted); }
    .chevron { margin-left: auto; color: var(--muted); font-size: 11px; transition: transform 0.12s; }
    .group.collapsed .chevron { transform: rotate(-90deg); }
    /* Breathing room above and below each group, so it reads as one block
       apart from the ungrouped tabs around it (the colour bar on its tabs
       already says which tabs belong to it). Vertical margins collapse, so
       back-to-back groups get the same gap, not double. */
    .group { margin: 16px 0; }
    .group .group-header { margin-top: 0; }
    .group.collapsed .group-tabs { display: none; }
    /* Group membership is a thin bar in the group's colour on each of its
       tabs, not an indent — so a group's tabs line up with the ungrouped
       ones in both grid columns. */
    .group-tabs .item { position: relative; }
    .group-tabs .item::before {
      content: "";
      position: absolute;
      left: 2px; top: 6px; bottom: 6px;
      width: 2px;
      border-radius: 1px;
      background: var(--group-color, var(--hairline));
    }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 6px 10px;
      font: inherit;
      color: var(--fg);
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      min-width: 0;
    }
    .item:hover, .item:focus-visible { background: var(--card-bg); outline: none; }

    /* A row = the tab's button + (this device's tabs only) a close button
       at its end, shown on hover or while the row has keyboard focus; the
       row's text makes room for it rather than running under it. */
    .row { position: relative; min-width: 0; }
    .row:hover .item { background: var(--card-bg); }
    .close {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 0;
      font: inherit;
      font-size: 12px;
      line-height: 1;
      color: var(--muted);
      background: none;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .row:hover .close, .row:focus-within .close { display: inline-flex; }
    .row.closable:hover .item, .row.closable:focus-within .item { padding-right: 34px; }
    .close:hover { color: var(--fg); background: var(--hairline); }
    .item:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
    /* What Enter in the search box would open. */
    body.searching .item.selected { background: var(--card-bg); box-shadow: inset 0 0 0 1px var(--accent); }
    .num {
      flex-shrink: 0;
      min-width: var(--num-w, 2ch);
      text-align: right;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
    /* Favicons are drawn for light backgrounds — a black one (GitHub's,
       say) all but disappears on the dark theme, so in dark mode they sit
       on a small light chip, the way Chrome's own dark new tab page does.
       Defined here, not in the shared theme.css, to keep this page from
       touching anything popup/options rely on. Same pattern
       as theme.css: OS dark mode unless "light" was chosen, or an
       explicit "dark"/"black". */
    :root { --favicon-chip: transparent; --favicon-pad: 0px; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --favicon-chip: #e8eaed; --favicon-pad: 2px; }
    }
    :root[data-theme="dark"], :root[data-theme="black"] { --favicon-chip: #e8eaed; --favicon-pad: 2px; }

    .icon {
      width: calc(16px + 2 * var(--favicon-pad));
      height: calc(16px + 2 * var(--favicon-pad));
      flex-shrink: 0;
      border-radius: 4px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
      color: var(--accent-fg); background: var(--muted);
    }
    img.icon { background: var(--favicon-chip); padding: var(--favicon-pad); }
    .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { flex-shrink: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .item.current .title { font-weight: 600; }

    .note { color: var(--muted); font-size: 13px; margin: 8px 10px; }

    /* Optional Matrix rain (newtab-matrix.js): behind everything, faint
       enough that the text in front always wins. */
    #matrix {
      position: fixed;
      inset: 0;
      z-index: -1;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.16;
    }

    /* The optional copy of the browser's bookmarks bar
       (newtab-bookmarks.js): one line across the very top, staying there
       while the page scrolls; folders open menus. */
    #bookmarksBar {
      position: sticky;
      top: 0;
      z-index: 4;
      padding: 4px 8px;
      background: color-mix(in srgb, var(--bg) 82%, transparent); /* frosted, like #searchBar */
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
    }
    /* Centred, and semi-transparent until the pointer (or keyboard focus,
       or an open menu) is on it — present, but quiet. */
    .bm-items {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      overflow: hidden;
      white-space: nowrap;
      opacity: 0.45;
      transition: opacity 0.2s;
    }
    .bm-items.measuring { justify-content: flex-start; }
    #bookmarksBar:hover .bm-items,
    #bookmarksBar:focus-within .bm-items,
    #bookmarksBar.menu-open .bm-items { opacity: 1; }
    .bm-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      max-width: 180px;
      padding: 4px 8px;
      font: inherit;
      font-size: 12.5px;
      color: var(--fg);
      background: none;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      cursor: pointer;
    }
    .bm-item:hover, .bm-item:focus-visible, .bm-item.open { background: var(--card-bg); outline: none; }
    .bm-item .bm-title { overflow: hidden; text-overflow: ellipsis; }
    .bm-sep { width: 8px; flex-shrink: 0; }
    .bm-more { color: var(--muted); }
    .bm-folder-icon { width: 16px; height: 16px; flex-shrink: 0; fill: var(--muted); }

    .bm-menu {
      position: fixed;
      z-index: 10;
      min-width: 200px;
      max-width: 320px;
      max-height: calc(100vh - 16px);
      overflow-y: auto;
      padding: 4px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    }
    .bm-entry {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 5px 8px;
      font: inherit;
      font-size: 13px;
      color: var(--fg);
      background: none;
      border: none;
      border-radius: 6px;
      text-decoration: none;
      text-align: left;
      cursor: pointer;
    }
    .bm-entry:hover, .bm-entry:focus-visible, .bm-entry.open { background: var(--card-bg); outline: none; }
    .bm-entry .bm-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bm-arrow { color: var(--muted); font-size: 10px; }
    .bm-menu-gap { height: 6px; }
    .bm-empty { color: var(--muted); font-size: 12px; padding: 5px 8px; }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <canvas id="matrix" aria-hidden="true" hidden></canvas>
  <nav id="bookmarksBar" aria-label="Bookmarks bar" hidden><div class="bm-items"></div></nav>
  <div id="bookmarkMenus"></div>
  <main>
    <div class="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>

    <div id="searchBar">
      <div class="search-box">
        <span id="searchChip" class="search-chip" hidden></span>
        <input id="search" type="search" placeholder="Search tabs or the web, or type a tab number…" autocomplete="off" spellcheck="false" autofocus />
      </div>
    </div>
    <div id="webActions" hidden></div>

    <section id="localSection">
      <div id="local"></div>
    </section>

    <section id="archivedSection" hidden>
      <div id="archivedTitle" class="section-title">Auto-archived</div>
      <div id="archived"></div>
    </section>

    <div id="empty" class="note" hidden>No matching tabs.</div>
  </main>

  <script src="browser-polyfill.min.js"></script>
  <script src="theme.js"></script>
  <script src="newtab-settings.js"></script>
  <script src="newtab-dom.js"></script>
  <script src="newtab-clock.js"></script>
  <script src="newtab-search.js"></script>
  <script src="newtab.js"></script>
  <script src="newtab-bookmarks.js"></script>
  <script src="newtab-matrix.js"></script>
</body>
</html>
