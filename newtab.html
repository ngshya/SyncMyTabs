<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }
    main {
      max-width: 680px;
      margin: 0 auto;
      padding: 9vh 16px 64px;
    }

    .clock { text-align: center; margin-bottom: 28px; }
    #time {
      font-size: 72px;
      font-weight: 200;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    #date { margin-top: 10px; font-size: 15px; color: var(--muted); }
    #date::first-letter { text-transform: uppercase; }

    #search {
      width: 100%;
      padding: 11px 14px;
      font: inherit;
      font-size: 15px;
      color: var(--fg);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }
    #search:focus { border-color: var(--accent); }

    section { margin-top: 28px; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--section-title);
      margin: 0 0 6px 10px;
    }
    .sub-title {
      font-size: 12px;
      color: var(--muted);
      margin: 14px 0 4px 10px;
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 7px 10px;
      margin-top: 4px;
      font: inherit;
      font-weight: 600;
      color: var(--fg);
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
    }
    .group-header:hover, .group-header:focus-visible { background: var(--card-bg); outline: none; }
    .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
    .group-header .count { font-weight: 400; color: var(--muted); }
    .chevron { margin-left: auto; color: var(--muted); font-size: 11px; transition: transform 0.12s; }
    .group.collapsed .chevron { transform: rotate(-90deg); }
    .group.collapsed .group-tabs { display: none; }
    .group-tabs { margin-left: 13px; padding-left: 4px; border-left: 2px solid var(--group-color, var(--hairline)); }

    .item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 6px 10px;
      font: inherit;
      color: var(--fg);
      background: none;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: left;
      min-width: 0;
    }
    .item:hover, .item:focus-visible { background: var(--card-bg); outline: none; }
    .item:focus-visible { box-shadow: inset 0 0 0 1px var(--accent); }
    .icon {
      width: 16px; height: 16px; flex-shrink: 0;
      border-radius: 3px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700;
      color: var(--accent-fg); background: var(--muted);
    }
    img.icon { background: none; }
    .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { flex-shrink: 0; max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; }
    .item.current .title { font-weight: 600; }

    .note { color: var(--muted); font-size: 13px; margin: 8px 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="clock">
      <div id="time">--:--</div>
      <div id="date"></div>
    </div>

    <input id="search" type="search" placeholder="Search open tabs…" autocomplete="off" spellcheck="false" autofocus />

    <section id="localSection">
      <div id="local"></div>
    </section>

    <section id="remoteSection" hidden>
      <div class="section-title">On your other devices</div>
      <div id="remote"></div>
    </section>

    <div id="empty" class="note" hidden>No matching tabs.</div>
  </main>

  <script src="browser-polyfill.min.js"></script>
  <script src="theme.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
