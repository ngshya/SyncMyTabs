name: Release

# Tag a version (e.g. `git tag v2.0.1 && git push origin v2.0.1`) and this
# workflow builds the store-ready extension zip and publishes it as a GitHub
# Release, so the packaged .zip shows up directly on the Releases page.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          echo "tag=v$TAG_VERSION  manifest=$MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Syntax-check JavaScript
        run: |
          node --check background.js
          node --check popup.js
          node --check options.js

      - name: Build extension zip
        run: |
          ZIP="syncmytabs-${GITHUB_REF_NAME#v}.zip"
          zip -r "$ZIP" \
            manifest.json \
            background.js \
            popup.html popup.js \
            options.html options.js \
            icons \
            -x '*.DS_Store'
          unzip -l "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
