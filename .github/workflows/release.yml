name: Release

# Three ways to cut a release:
#   1. Merge/push to main: automatic — if manifest.json's version isn't
#      already released, it's built and published. If it IS already
#      released (e.g. a doc-only merge that didn't bump the version),
#      the release job is skipped, not failed.
#   2. Push a version tag:   git tag v2.2.1 && git push origin v2.2.1
#   3. Actions tab -> "Release" -> "Run workflow" (workflow_dispatch): builds
#      from the chosen ref and tags/releases as v<manifest version>; fails
#      loudly if that version was already released (bump it first).
# All three build the same store-ready zips and publish them as a GitHub
# Release.

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to release from (defaults to the selected branch)"
        required: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Triggered by a pushed tag: it must match the manifest version.
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG#v}" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag $TAG does not match manifest.json version $MANIFEST_VERSION"
              exit 1
            fi
            SHOULD_RELEASE=true
          else
            # Push to main, or a manual run: derive the tag from the
            # manifest.
            TAG="v$MANIFEST_VERSION"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                # An explicit manual request for an already-released
                # version is almost certainly a mistake — fail loudly.
                echo "::error::Release $TAG already exists — bump the version in manifest.json"
                exit 1
              fi
              # A push to main that didn't bump the version (e.g. a
              # docs-only merge) — nothing new to release, not an error.
              echo "Release $TAG already exists — nothing to do for this push."
              SHOULD_RELEASE=false
            else
              SHOULD_RELEASE=true
            fi
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "version=$MANIFEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE tag=$TAG (manifest $MANIFEST_VERSION) via ${{ github.event_name }}"

  package:
    needs: check
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual runs release whatever ref you pick; the tag-push case
          # checks out the tag automatically. Full history for release notes.
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Syntax-check JavaScript
        run: |
          node --check background.js
          node --check sync-core.js
          node --check groups-core.js
          node --check archive-core.js
          node --check popup.js
          node --check options.js
          node --check theme.js
          node --check lazy.js
          node --check link-leash-content.js

      - name: Run test suite
        run: node --test test/*.test.js

      - name: Build store-specific zips (Chrome + Firefox)
        run: |
          # The repo manifest is "dual" (loads on both for dev). Here we
          # emit a tailored manifest per store so neither shows warnings:
          #  - Chrome: service worker only, no gecko settings.
          #  - Firefox: background scripts only.
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const chrome = JSON.parse(JSON.stringify(m));
            delete chrome.background.scripts;
            delete chrome.browser_specific_settings;
            fs.writeFileSync("manifest.chrome.json", JSON.stringify(chrome, null, 2));
            const firefox = JSON.parse(JSON.stringify(m));
            delete firefox.background.service_worker;
            fs.writeFileSync("manifest.firefox.json", JSON.stringify(firefox, null, 2));
          '

          # Keep this list in sync with every top-level source file the
          # manifest references (background scripts + content scripts)
          # AND every file an HTML page loads via its own <script>/<link>
          # tags (options.html/popup.html -> theme.css/theme.js, in
          # particular) — a file missing here either ships a manifest
          # that points at something the zip doesn't contain (fails to
          # load entirely — importScripts throws, no listeners ever
          # register) or a page with a broken script/stylesheet link
          # (e.g. options.html 404s -> "Open full settings" fails with
          # ERR_FILE_NOT_FOUND; theme.css 404s -> every CSS custom
          # property is undefined, so buttons render with no background
          # at all). This exact omission (archive-core.js/options.html/
          # options.js/theme.css/theme.js missing from a release build)
          # shipped once already — see CLAUDE.md/git history.
          COMMON="background.js sync-core.js groups-core.js archive-core.js link-leash-content.js browser-polyfill.min.js popup.html popup.js options.html options.js theme.css theme.js lazy.html lazy.js icons"
          mkdir -p build/chrome build/firefox
          cp -r $COMMON build/chrome/ && cp manifest.chrome.json build/chrome/manifest.json
          cp -r $COMMON build/firefox/ && cp manifest.firefox.json build/firefox/manifest.json

          CHROME_ZIP="syncmytabs-${VERSION}-chrome.zip"
          FIREFOX_ZIP="syncmytabs-${VERSION}-firefox.zip"
          (cd build/chrome && zip -r "../../$CHROME_ZIP" . -x '*.DS_Store')
          (cd build/firefox && zip -r "../../$FIREFOX_ZIP" . -x '*.DS_Store')
          unzip -l "$CHROME_ZIP"; unzip -l "$FIREFOX_ZIP"
          echo "CHROME_ZIP=$CHROME_ZIP" >> "$GITHUB_ENV"
          echo "FIREFOX_ZIP=$FIREFOX_ZIP" >> "$GITHUB_ENV"

      - name: Lint the Firefox build (web-ext, informational)
        run: npx --yes web-ext lint --source-dir build/firefox || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For a manual run or a push to main the tag doesn't exist yet,
          # so create it at the commit we built; for a tag push it
          # already exists and --target is ignored.
          gh release create "$TAG" "$CHROME_ZIP" "$FIREFOX_ZIP" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes
