name: Release

# Two ways to cut a release:
#   1. Push a version tag:   git tag v2.2.1 && git push origin v2.2.1
#   2. Actions tab -> "Release" -> "Run workflow" (workflow_dispatch): builds
#      from the chosen ref and tags/releases as v<manifest version>.
# Either way it builds the store-ready zip and publishes it as a GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/tag/SHA to release from (defaults to the selected branch)"
        required: false

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Manual runs release whatever ref you pick; the tag-push case
          # checks out the tag automatically. Full history for release notes.
          ref: ${{ github.event.inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Determine version and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
          if [ "${{ github.event_name }}" = "push" ]; then
            # Triggered by a pushed tag: it must match the manifest version.
            TAG="${GITHUB_REF_NAME}"
            if [ "${TAG#v}" != "$MANIFEST_VERSION" ]; then
              echo "::error::Tag $TAG does not match manifest.json version $MANIFEST_VERSION"
              exit 1
            fi
          else
            # Manual run: derive the tag from the manifest and refuse to
            # clobber an existing release (bump the version instead).
            TAG="v$MANIFEST_VERSION"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Release $TAG already exists — bump the version in manifest.json"
              exit 1
            fi
          fi
          echo "VERSION=$MANIFEST_VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "Building $TAG (manifest $MANIFEST_VERSION) via ${{ github.event_name }}"

      - name: Syntax-check JavaScript
        run: |
          node --check background.js
          node --check popup.js
          node --check options.js
          node --check lazy.js

      - name: Build store-specific zips (Chrome + Firefox)
        run: |
          # The repo manifest is "dual" (loads on both for dev). Here we
          # emit a tailored manifest per store so neither shows warnings:
          #  - Chrome: service worker only, no gecko settings.
          #  - Firefox: background scripts only, minus the Chrome-only
          #    tabGroups permission (feature-detected at runtime anyway).
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            const chrome = JSON.parse(JSON.stringify(m));
            delete chrome.background.scripts;
            delete chrome.browser_specific_settings;
            fs.writeFileSync("manifest.chrome.json", JSON.stringify(chrome, null, 2));
            const firefox = JSON.parse(JSON.stringify(m));
            delete firefox.background.service_worker;
            firefox.permissions = (firefox.permissions || []).filter((p) => p !== "tabGroups");
            fs.writeFileSync("manifest.firefox.json", JSON.stringify(firefox, null, 2));
          '

          COMMON="background.js browser-polyfill.min.js popup.html popup.js options.html options.js lazy.html lazy.js icons"
          mkdir -p build/chrome build/firefox
          cp -r $COMMON build/chrome/ && cp manifest.chrome.json build/chrome/manifest.json
          cp -r $COMMON build/firefox/ && cp manifest.firefox.json build/firefox/manifest.json

          CHROME_ZIP="syncmytabs-${VERSION}-chrome.zip"
          FIREFOX_ZIP="syncmytabs-${VERSION}-firefox.zip"
          (cd build/chrome && zip -r "../../$CHROME_ZIP" . -x '*.DS_Store')
          (cd build/firefox && zip -r "../../$FIREFOX_ZIP" . -x '*.DS_Store')
          unzip -l "$CHROME_ZIP"; unzip -l "$FIREFOX_ZIP"
          echo "CHROME_ZIP=$CHROME_ZIP" >> "$GITHUB_ENV"
          echo "FIREFOX_ZIP=$FIREFOX_ZIP" >> "$GITHUB_ENV"

      - name: Lint the Firefox build (web-ext, informational)
        run: npx --yes web-ext lint --source-dir build/firefox || true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # For a manual run the tag doesn't exist yet, so create it at the
          # commit we built; for a tag push it already exists and --target
          # is ignored.
          gh release create "$TAG" "$CHROME_ZIP" "$FIREFOX_ZIP" \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes
